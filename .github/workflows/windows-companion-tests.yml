name: Windows Companion (.NET 10) Tests

on:
  push:
    branches:
      - main
    paths:
      - "companion/windows/**"
      - ".github/workflows/windows-companion-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "src/lib/remote/protocol-contract.test.ts"
      - "src/lib/remote/protocol.ts"
      - "src/lib/remote/keys.ts"
      - "src/lib/pairing.ts"
      - "src/routes/api/public/agent/pair.ts"
  pull_request:
    branches:
      - main
    paths:
      - "companion/windows/**"
      - ".github/workflows/windows-companion-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "src/lib/remote/protocol-contract.test.ts"
      - "src/lib/remote/protocol.ts"
      - "src/lib/remote/keys.ts"
      - "src/lib/pairing.ts"
      - "src/routes/api/public/agent/pair.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-companion:
    name: Build & Test .NET 10 (Windows)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      TEST_PROJECT: companion/windows/tests/Beacon.Companion.Tests/Beacon.Companion.Tests.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET SDK info
        run: dotnet --info

      - name: Restore NuGet dependencies
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build Core and Tests (Release)
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Run xUnit tests and generate TRX report
        id: test
        run: >
          dotnet test "${{ env.TEST_PROJECT }}"
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=beacon-companion-tests.trx"
          --results-directory TestResults

      - name: Upload TRX test report artifact
        if: ${{ steps.test.outcome == 'success' || steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: beacon-companion-windows-trx
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 30

  test-typescript-contract:
    name: TypeScript Cross-Language Contract Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install project dependencies
        run: npm ci

      - name: Run TypeScript cross-language protocol contract tests
        run: npm test -- src/lib/remote/protocol-contract.test.ts
