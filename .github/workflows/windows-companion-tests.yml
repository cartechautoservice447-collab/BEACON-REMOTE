name: Windows Companion (.NET 10) Tests

on:
  push:
    branches:
      - main
    paths:
      - "companion/windows/**"
      - ".github/workflows/windows-companion-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "src/lib/remote/protocol-contract.test.ts"
      - "src/lib/remote/protocol.ts"
      - "src/lib/remote/keys.ts"
      - "src/lib/pairing.ts"
      - "src/routes/api/public/agent/pair.ts"
      - "src/routes/api/public/agent/heartbeat.ts"
  pull_request:
    branches:
      - main
    paths:
      - "companion/windows/**"
      - ".github/workflows/windows-companion-tests.yml"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "src/lib/remote/protocol-contract.test.ts"
      - "src/lib/remote/protocol.ts"
      - "src/lib/remote/keys.ts"
      - "src/lib/pairing.ts"
      - "src/routes/api/public/agent/pair.ts"
      - "src/routes/api/public/agent/heartbeat.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows-companion:
    name: Build & Test .NET 10 (Windows)
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MSBUILDTERMINALLOGGER: "false"
      TEST_PROJECT: companion/windows/tests/Beacon.Companion.Tests/Beacon.Companion.Tests.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET SDK info
        run: dotnet --info

      - name: Restore NuGet dependencies
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build Core and Tests (Release)
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Prepare test results directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path TestResults | Out-Null

      - name: Run xUnit tests and generate TRX report
        id: test
        run: >
          dotnet test "${{ env.TEST_PROJECT }}"
          --configuration Release
          --no-build
          --verbosity normal
          --blame-crash
          --blame-hang-timeout 60s
          --diag:TestResults/vstest-diag.log
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=beacon-companion-tests.trx"
          --results-directory TestResults
          -bl:TestResults/msbuild-test.binlog

      - name: Print TRX & Test Host Failure Summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $trxFiles) {
            Write-Warning "No TRX files found under TestResults."
          } else {
            foreach ($trxFile in $trxFiles) {
              [xml]$trx = Get-Content -Path $trxFile.FullName -Raw
              $ns = New-Object System.Xml.XmlNamespaceManager($trx.NameTable)
              $ns.AddNamespace("t", "http://microsoft.com/schemas/VisualStudio/TeamTest/2010")
              $counters = $trx.SelectSingleNode("//t:ResultSummary/t:Counters", $ns)
              $summary = $trx.SelectSingleNode("//t:ResultSummary", $ns)
              Write-Host "=== TRX FILE: $($trxFile.Name) | Outcome: $($summary.outcome) ==="
              if ($counters) {
                $total = [int]$counters.total
                $executed = [int]$counters.executed
                $skipped = $total - $executed
                Write-Host ("Total={0} Executed={1} Passed={2} Failed={3} Skipped={4} Error={5} Timeout={6} Aborted={7}" -f $total, $executed, $counters.passed, $counters.failed, $skipped, $counters.error, $counters.timeout, $counters.aborted)
                "### TRX Summary ($($trxFile.Name)): Outcome=$($summary.outcome)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                "- Total: $total | Executed: $executed | Passed: $($counters.passed) | Failed: $($counters.failed) | Skipped: $skipped | Error: $($counters.error) | Aborted: $($counters.aborted)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
              $nonPassed = $trx.SelectNodes("//t:UnitTestResult[@outcome!='Passed']", $ns)
              foreach ($r in $nonPassed) {
                $msgNode = $r.SelectSingleNode("t:Output/t:ErrorInfo/t:Message", $ns)
                $stkNode = $r.SelectSingleNode("t:Output/t:ErrorInfo/t:StackTrace", $ns)
                $msg = if ($msgNode) { $msgNode."#text" } else { "(no error message)" }
                $stk = if ($stkNode) { $stkNode."#text" } else { "(no stack trace)" }
                Write-Host "::error title=$($r.testName) ($($r.outcome))::$msg"
                Write-Host $stk
                "`n#### $($r.outcome): $($r.testName)`n``````text`n$msg`n$stk`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
              $runInfos = $trx.SelectNodes("//t:ResultSummary/t:RunInfos/t:RunInfo", $ns)
              foreach ($ri in $runInfos) {
                $textNode = $ri.SelectSingleNode("t:Text", $ns)
                $text = if ($textNode) { $textNode."#text" } else { "" }
                Write-Host "[$($ri.outcome)] $text"
              }
            }
          }

      - name: Upload TRX & VSTest diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beacon-companion-windows-trx
          path: TestResults/**/*
          if-no-files-found: warn
          retention-days: 30

  test-typescript-contract:
    name: TypeScript Cross-Language Contract Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install project dependencies
        run: npm ci

      - name: Run TypeScript cross-language protocol contract tests
        run: npm test -- src/lib/remote/protocol-contract.test.ts
